/* ===================== Premium layer ===================== */
:root{--navy:#0d2236;--navy-deep:#08141f;--navy-soft:#16324a;--gold:#c8a25a;--gold-light:#e3c98f;--gold-deep:#a8823a;--ink:#0f1d2a;--muted:#5d6b78;--cream:#f8f5ef;--line:#e9e3d7;--font:'Manrope','Segoe UI',Arial,sans-serif;--display:'Cormorant Garamond',Georgia,'Times New Roman',serif;--ease:cubic-bezier(.22,.61,.36,1);--shadow:0 30px 60px -32px rgba(8,20,31,.45)}
body{font-family:var(--font);color:var(--ink)}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.005em}
p{color:var(--muted)}
::selection{background:var(--gold-light);color:var(--navy-deep)}
.section{padding:112px 0}
.eyebrow{display:flex;align-items:center;gap:12px;color:var(--gold-deep);font-weight:700;letter-spacing:.24em;font-size:11px}
.eyebrow:before{content:'';width:28px;height:1px;background:currentColor;flex-shrink:0}
.gold-text{color:var(--gold-light)}
.section-top{margin-bottom:46px}
.section-top h2{font-size:clamp(34px,3.7vw,52px);font-weight:500;line-height:1.06;color:var(--navy-deep);margin-bottom:14px}
.section-top p{font-size:16px;color:var(--muted)}
.section-link{border-radius:2px;border-color:#d9cfbc;text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:700;padding:13px 20px}
.section-link:hover{background:var(--navy-deep);border-color:var(--navy-deep);color:#fff}
.btn{border-radius:2px;text-transform:uppercase;letter-spacing:.15em;font-size:11.5px;font-weight:700;padding:18px 28px;transition:transform .4s var(--ease),background .4s,box-shadow .4s,color .3s}
.btn svg{transition:transform .4s var(--ease)}.btn:hover svg{transform:translateX(4px)}
.btn-gold{background:linear-gradient(135deg,#dcbc78,#b88d3e);color:#0b1724;box-shadow:0 16px 34px -16px rgba(200,162,90,.85)}
.btn-gold:hover{background:linear-gradient(135deg,#e7cb8e,#c39647);box-shadow:0 20px 40px -16px rgba(200,162,90,.95)}
.btn-dark{background:var(--navy-deep)}.btn-dark:hover{background:#13293d}
.btn-outline-light{border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.04)}
.btn-outline-light:hover{background:#fff;color:var(--navy-deep)}
.btn-muted{background:var(--cream);color:var(--navy-deep)}.btn-muted:hover{background:#efe9dd}

/* Header */
.site-header{background:rgba(8,20,31,.86);backdrop-filter:saturate(150%) blur(16px);-webkit-backdrop-filter:saturate(150%) blur(16px);border-bottom:1px solid rgba(200,162,90,.14);box-shadow:none;transition:background .4s,box-shadow .4s}
.site-header.scrolled{background:rgba(8,20,31,.97);box-shadow:0 14px 34px -16px rgba(0,0,0,.55)}
.header-main{height:88px;transition:height .45s var(--ease)}
.site-header.scrolled .header-main{height:72px}
.brand-symbol{transform:none;border:1px solid var(--gold);border-radius:1px;font-family:var(--display);font-weight:600;color:var(--gold);width:46px;height:46px}
.brand-name{font-family:var(--display);font-size:22px;font-weight:500;letter-spacing:.01em}
.brand-name strong{font-weight:700}
.brand-name small{font-family:var(--font);font-size:9px;letter-spacing:.34em;color:var(--gold);margin-top:4px}
.nav{gap:30px}
.nav>a,.nav-drop>a{text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:600;color:#d5dde4}
.nav>a:not(.nav-mobile-cta):before,.nav-drop>a:before{content:'';position:absolute;left:0;right:0;bottom:28px;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:right;transition:transform .45s var(--ease)}
.site-header.scrolled .nav>a:before,.site-header.scrolled .nav-drop>a:before{bottom:21px}
.nav>a:hover:before,.nav-drop>a:hover:before{transform:scaleX(1);transform-origin:left}
.nav>a.active:after,.nav-drop>a.active:after{bottom:28px;height:1px}
.site-header.scrolled .nav>a.active:after,.site-header.scrolled .nav-drop>a.active:after{bottom:21px}
.drop-menu{display:block;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .35s var(--ease),transform .35s var(--ease),visibility .35s;border-radius:2px;border:1px solid var(--line);padding:10px;top:calc(100% - 14px)}
.nav-drop:hover .drop-menu,.nav-drop:focus-within .drop-menu{opacity:1;visibility:visible;transform:none}
.drop-menu a{font-size:13px;border-radius:2px}
.drop-menu a:hover{background:var(--cream);color:var(--gold-deep)}
.nav-cta{padding:15px 20px;font-size:11px}

/* Hero */
.hero{min-height:clamp(640px,88vh,880px);background:var(--navy-deep)}
.hero-layout{min-height:clamp(640px,88vh,880px)}
.hero-picture{background-image:linear-gradient(90deg,rgba(6,15,24,.96) 0%,rgba(6,15,24,.84) 32%,rgba(6,15,24,.38) 66%,rgba(6,15,24,.12) 100%),url('assets/hero-nairobi.webp');background-position:center,62% center;animation:kenburns 24s var(--ease) both}
@keyframes kenburns{from{transform:scale(1.14)}to{transform:scale(1.02)}}
.hero:before{background:linear-gradient(0deg,rgba(6,15,24,.75),transparent 42%)}
.hero-glow{background:radial-gradient(closest-side,rgba(200,162,90,.14),transparent)}
.hero-copy{max-width:700px;padding:96px 0 120px}
.hero-copy>*{animation:fadeUp 1.1s var(--ease) both}
.hero-copy>*:nth-child(2){animation-delay:.12s}.hero-copy>*:nth-child(3){animation-delay:.24s}.hero-copy>*:nth-child(4){animation-delay:.36s}.hero-copy>*:nth-child(5){animation-delay:.48s}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.hero-kicker{letter-spacing:.32em;font-size:11px;font-weight:600;color:#cfd8e0;margin-bottom:30px}
.tiny-dash{width:38px;height:1px}
.hero h1{font-family:var(--display);font-weight:500;font-size:clamp(50px,6.4vw,94px);line-height:1;letter-spacing:-.015em;margin-bottom:30px}
.hero h1 em{font-style:italic;color:var(--gold-light);font-weight:500}
.hero-copy>p{font-size:17px;line-height:1.75;color:#d3dde6;max-width:540px;margin-bottom:38px}
.hero-actions{gap:16px}
.hero-proof{margin-top:54px;gap:34px;font-size:12px;letter-spacing:.06em;font-weight:600;color:#c7d2db}
.hero-feature{position:absolute;right:0;bottom:64px;z-index:3;width:340px;display:grid;grid-template-columns:104px 1fr;gap:16px;align-items:center;padding:12px;background:rgba(9,22,34,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.14);border-radius:3px;color:#fff;animation:fadeUp 1.1s .8s var(--ease) both;transition:transform .45s var(--ease),border-color .45s}
.hero-feature:hover{transform:translateY(-5px);border-color:rgba(200,162,90,.65)}
.hero-feature img{width:104px;height:84px;object-fit:cover;border-radius:2px}
.hero-feature small{display:block;color:var(--gold-light);letter-spacing:.22em;text-transform:uppercase;font-size:9.5px;font-weight:700}
.hero-feature strong{display:block;font-family:var(--display);font-size:20px;font-weight:600;line-height:1.15;margin:4px 0}
.hero-feature span{font-size:12.5px;color:#c4cfd9}

/* Trust strip */
.trust-strip{background:var(--cream);border-bottom:1px solid var(--line)}
.trust-inner{min-height:96px}
.trust-inner>div{color:#2c3e50;font-weight:600;letter-spacing:.02em;border-color:#e2dacb}
.trust-inner svg{color:var(--gold-deep)}

/* Listing cards with photo previews */
.machine-section{background:var(--cream)}
.listing-grid{gap:28px}
.listing-card{border:0;border-radius:3px;background:#fff;box-shadow:0 1px 0 rgba(15,29,42,.05),0 20px 44px -30px rgba(15,29,42,.45);transition:transform .55s var(--ease),box-shadow .55s var(--ease)}
.listing-card:hover{transform:translateY(-8px);box-shadow:0 34px 64px -32px rgba(15,29,42,.6)}
.listing-media{aspect-ratio:4/3.05;background:#15232f}
.listing-media-link{position:absolute;inset:0;display:block}
.listing-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s var(--ease),transform 1.4s var(--ease)}
.listing-media img.is-active{opacity:1}
.listing-card:hover .listing-media img{transform:scale(1.06)}
.listing-media:after{content:'';position:absolute;inset:58% 0 0;background:linear-gradient(0deg,rgba(6,15,24,.62),transparent);pointer-events:none;z-index:1}
.listing-badge{position:absolute;left:14px;top:14px;z-index:2;background:rgba(255,255,255,.94);color:var(--navy-deep);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:6px 10px;border-radius:1px}
.quick-view{position:absolute;right:14px;top:14px;z-index:3;border:0;background:rgba(8,20,31,.66);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-size:11px;font-weight:600;letter-spacing:.05em;padding:6px 10px;border-radius:1px;display:inline-flex;gap:6px;align-items:center;transition:background .3s,color .3s}
.quick-view:hover{background:var(--gold);color:var(--navy-deep)}
.media-nav{position:absolute;top:50%;z-index:3;width:36px;height:36px;margin-top:-18px;border:0;border-radius:50%;background:rgba(255,255,255,.94);color:var(--navy-deep);display:grid;place-items:center;opacity:0;transition:opacity .35s,transform .35s var(--ease),background .3s;box-shadow:0 8px 20px rgba(0,0,0,.22)}
.media-nav.prev{left:12px;transform:translateX(-8px)}.media-nav.prev svg{transform:rotate(180deg)}
.media-nav.next{right:12px;transform:translateX(8px)}
.media-nav:hover{background:var(--gold)}
.listing-media:hover .media-nav,.media-nav:focus-visible{opacity:1;transform:none}
@media (hover:none){.media-nav{opacity:.9;transform:none;width:32px;height:32px;margin-top:-16px}}
.media-dots{position:absolute;left:0;right:0;bottom:14px;z-index:2;display:flex;justify-content:center;gap:6px;pointer-events:none}
.media-dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.5);transition:width .4s var(--ease),background .4s}
.media-dots i.on{width:20px;background:#fff}
.listing-copy{padding:24px 24px 22px}
.listing-type{letter-spacing:.18em;font-size:10.5px;color:var(--gold-deep);margin-bottom:12px}
.status-dot{background:#d5c6a6}
.listing-copy h3{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.14;letter-spacing:0;margin-bottom:12px;color:var(--navy-deep)}
.listing-copy h3 a:hover{color:var(--gold-deep)}
.item-meta{font-size:13px;color:#6c7a87}
.item-meta svg{color:var(--gold-deep)}
.listing-bottom{border-top-color:#eee7da;margin-top:18px;padding-top:16px}
.price-caption{text-transform:uppercase;letter-spacing:.16em;font-size:9.5px;color:#98a3ad;margin-bottom:3px}
.listing-bottom strong{white-space:nowrap;font-family:var(--display);font-size:clamp(18px,1.45vw,23px);font-weight:600;letter-spacing:0;color:var(--navy-deep)}
.card-arrow{flex-shrink:0;width:40px;height:40px;border-radius:50%;border-color:#e3d9c7;transition:background .35s,border-color .35s,color .35s}
.card-arrow:hover{background:var(--gold);border-color:var(--gold);color:var(--navy-deep)}

/* About */
.about-grid{gap:96px}
.about-visual{border-radius:2px;min-height:540px;box-shadow:var(--shadow);overflow:visible}
.about-visual>img{min-height:540px;border-radius:2px}
.about-visual:before{content:'';position:absolute;inset:-18px 18px 18px -18px;border:1px solid rgba(200,162,90,.55);z-index:-1}
.about-visual:after{border-radius:2px}
.about-image-badge{border-radius:1px;font-weight:600;letter-spacing:.04em}
.about-copy h2{font-size:clamp(36px,3.8vw,56px);font-weight:500;line-height:1.05}
.about-copy h2 span{color:var(--gold-deep);font-style:italic}
.about-checks span{font-weight:600}
.about-checks svg{color:var(--gold-deep)}

/* Benefits / steps / services */
.benefits-section{background:var(--cream)}
.benefit{border:1px solid var(--line);border-radius:2px;padding:36px 30px;transition:transform .55s var(--ease),box-shadow .55s var(--ease),border-color .55s}
.benefit:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:rgba(200,162,90,.55)}
.benefit-icon,.service-card-icon{background:transparent;border:1px solid rgba(200,162,90,.55);border-radius:50%;color:var(--gold-deep)}
.benefit h3{font-size:25px;font-weight:600}
.step{border-color:var(--line);border-radius:2px;padding:38px}
.step:after{color:var(--gold)}
.step-number{font-family:var(--display);font-size:60px;font-weight:500;line-height:1;color:var(--gold)}
.step h3{font-size:28px}
.service-card{border-color:var(--line);border-radius:2px;padding:36px;transition:transform .55s var(--ease),box-shadow .55s var(--ease),border-color .55s}
.service-card:hover{border-color:rgba(200,162,90,.55);transform:translateY(-6px)}
.service-card h3{font-size:25px}
.mission-card{border-radius:2px;background:var(--cream);border-color:var(--line);padding:46px}
.mission-card h2{font-size:36px;font-weight:500}
.gold-mission{background:var(--navy-deep);border-color:var(--navy-deep)}
.gold-mission h2{color:#fff}.gold-mission p{color:#b8c6d2}
.selling-section{background:var(--navy-deep)}
.selling-grid h2{font-size:clamp(38px,4vw,56px);font-weight:500;line-height:1.05}
.selling-image{height:440px;border-radius:2px}

/* Gallery band */
.gallery-band{background:var(--navy-deep);padding:112px 0}
.gallery-band .section-link:hover{background:#fff;color:var(--navy-deep)}
.gallery-strip-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:230px;gap:14px}
.gallery-strip-item{aspect-ratio:auto;border-radius:2px;cursor:zoom-in}
.gallery-strip-item:first-child{grid-column:span 2;grid-row:span 2}
.gallery-strip-item img{transition:transform 1.4s var(--ease)}
.gallery-strip-item span{font-family:var(--display);font-size:22px;font-weight:600;bottom:18px;left:20px}
.gallery-strip-item:first-child span{font-size:30px}

/* Contact */
.contact-section{background:linear-gradient(120deg,rgba(8,20,31,.97),rgba(13,34,54,.9)),url('assets/banner-towers-sm.webp') center/cover;padding:112px 0}
.contact-story h2{font-weight:500;font-size:clamp(40px,4.2vw,60px);line-height:1.04}
.contact-story h2 span{font-style:italic}
.contact-form-wrap{border-radius:2px;padding:40px;box-shadow:0 40px 80px -40px rgba(0,0,0,.6)}
.form-heading h3{font-size:30px}
.contact-form input,.contact-form select,.contact-form textarea{border-radius:2px;border-color:#e2dccf;background:#fcfbf8}
.contact-form :is(input,select,textarea):focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,162,90,.15);background:#fff}

/* Footer */
.site-footer{background:#050d14}
.site-footer h4{font-family:var(--font);text-transform:uppercase;letter-spacing:.2em;font-size:11px;color:var(--gold-light)}

/* Inner pages */
.page-banner{min-height:400px;display:flex;align-items:flex-end;background:var(--navy-deep)}
.page-banner-bg{background-image:linear-gradient(90deg,rgba(6,15,24,.95),rgba(6,15,24,.78) 55%,rgba(6,15,24,.45)),url('assets/banner-towers.webp');background-position:center,center 38%;opacity:1;animation:kenburns 20s var(--ease) both}
.page-banner-inner{padding:110px 0 58px}
.page-banner-inner>*{animation:fadeUp 1s var(--ease) both}
.page-banner-inner>*:nth-child(2){animation-delay:.1s}.page-banner-inner>*:nth-child(3){animation-delay:.2s}.page-banner-inner>*:nth-child(4){animation-delay:.3s}
.page-banner h1{font-weight:500;font-size:clamp(42px,5.2vw,72px);line-height:1.02;margin-bottom:18px}
.page-banner p{color:#c9d5df}
.breadcrumbs{letter-spacing:.08em}
.catalog-section{background:#fff}
.catalog-toolbar{border-radius:2px;border-color:var(--line);box-shadow:0 20px 40px -32px rgba(15,29,42,.4)}
.catalog-search,.catalog-select{border-radius:2px;border-color:#e6dfd2}
.catalog-demo{color:var(--gold-deep)}
.mini-cta{background:var(--navy-deep);padding:76px 0;border-top:1px solid rgba(200,162,90,.2)}
.mini-cta h2{font-size:clamp(32px,3.2vw,44px);font-weight:500}

/* Detail page mosaic */
.detail-mosaic{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;height:clamp(400px,44vw,580px);margin-bottom:40px;border-radius:2px;overflow:hidden}
.detail-mosaic.count-4{grid-template-columns:2fr 1fr;grid-template-rows:repeat(3,1fr)}
.mosaic-tile{position:relative;padding:0;border:0;overflow:hidden;background:#15232f;cursor:zoom-in;min-height:0}
.mosaic-tile.main{grid-row:1/-1}
.mosaic-tile img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease),filter .5s}
.mosaic-tile:hover img{transform:scale(1.05)}
.mosaic-more{position:absolute;inset:0;background:rgba(8,20,31,.58);color:#fff;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:11px;transition:background .4s}
.mosaic-tile:hover .mosaic-more{background:rgba(8,20,31,.4)}
.mosaic-tile .demo-overlay{border-radius:1px;letter-spacing:.06em;z-index:1}
.detail-section{background:var(--cream)}
.detail-layout{gap:40px}
.detail-description,.detail-side-card,.detail-help{border-radius:2px;border-color:var(--line)}
.detail-description{margin-top:0;padding:40px}
.detail-description h2{font-size:36px;font-weight:500}
.detail-highlights>div{border-radius:2px;border-color:var(--line)}
.detail-aside{position:sticky;top:110px}
.detail-side-card h2{font-size:38px;font-weight:600;letter-spacing:0}

/* Gallery page */
.tab{border-radius:2px;text-transform:uppercase;letter-spacing:.14em;font-size:11px;padding:12px 22px;border-color:#ddd3c1}
.tab.active,.tab:hover{background:var(--navy-deep);border-color:var(--navy-deep)}
.gallery-full-grid{gap:24px}
.gallery-item{border-radius:2px;border-color:var(--line);cursor:zoom-in}
.gallery-item>img{aspect-ratio:4/3;transition:transform 1.2s var(--ease)}
.gallery-item{overflow:hidden}
.gallery-item:hover>img{transform:scale(1.04)}
.gallery-title{position:relative;background:#fff;z-index:1;padding:18px}
.gallery-title strong{font-family:var(--display);font-size:21px;font-weight:600}
.gallery-title small{text-transform:uppercase;letter-spacing:.16em;font-size:10px;color:var(--gold-deep)}
.gallery-zoom{border-radius:50%;background:rgba(255,255,255,.92);color:var(--navy-deep)}

/* Contact page */
.contact-intro h2{font-size:clamp(36px,3.6vw,50px);font-weight:500;line-height:1.06}
.city-panel{border-radius:2px;height:220px}
.contact-page-form{border-color:var(--line)}

/* Lightbox (photo previews) */
.lightbox{animation:fadeIn .35s var(--ease)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.lightbox-backdrop{background:rgba(4,10,16,.95);backdrop-filter:blur(10px)}
.lightbox-content{background:transparent;box-shadow:none;border-radius:0;overflow:visible;max-width:min(1180px,92vw)}
.lightbox-content>.lightbox-stage{position:relative;display:grid;place-items:center;padding:0}
.lightbox-stage img{max-height:72vh;max-width:100%;width:auto;object-fit:contain;border-radius:2px;background:#0c1823}
.lb-anim{animation:lbIn .55s var(--ease)}
@keyframes lbIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.lightbox-content>.lightbox-meta{display:flex;justify-content:space-between;align-items:end;gap:16px;padding:18px 2px 14px;color:#fff}
.lightbox-meta strong{display:block;font-family:var(--display);font-size:24px;font-weight:600}
.lightbox-meta span{font-size:13px;color:#9fb0bf}
.lightbox-meta #lb-count{font-size:12px;letter-spacing:.2em;color:var(--gold-light);white-space:nowrap}
.lb-nav{position:absolute;top:50%;margin-top:-26px;width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(8,20,31,.5);color:#fff;display:grid;place-items:center;transition:background .3s,border-color .3s;z-index:2}
.lb-nav:hover{background:var(--gold);border-color:var(--gold);color:var(--navy-deep)}
.lb-prev{left:-76px}.lb-prev svg{transform:rotate(180deg)}.lb-next{right:-76px}
.lightbox-content>.lb-thumbs{display:flex;gap:8px;justify-content:center;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.lb-thumbs button{flex:0 0 auto;width:76px;height:54px;padding:0;border:1px solid transparent;border-radius:2px;overflow:hidden;background:none;opacity:.45;transition:opacity .3s,border-color .3s}
.lb-thumbs button:hover{opacity:.8}.lb-thumbs button.on{opacity:1;border-color:var(--gold)}
.lb-thumbs img{width:100%;height:100%;object-fit:cover}
.lightbox-close{position:fixed;right:24px;top:24px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);z-index:3}
.lightbox-close:hover{background:#fff;color:var(--navy-deep)}

/* Loading experience */
#preloader{position:fixed;inset:0;z-index:300;background:var(--navy-deep);display:grid;place-items:center;transition:opacity .8s var(--ease),visibility .8s}
#preloader.done{opacity:0;visibility:hidden}
.preloader-inner{display:grid;justify-items:center;gap:18px;color:#fff}
.preloader-mark{width:66px;height:66px;border:1px solid var(--gold);display:grid;place-items:center;font-family:var(--display);color:var(--gold);font-size:27px;letter-spacing:.06em;animation:markPulse 1.8s ease-in-out infinite}
@keyframes markPulse{0%,100%{box-shadow:0 0 0 0 rgba(200,162,90,.35)}50%{box-shadow:0 0 0 12px rgba(200,162,90,0)}}
.preloader-name{font-family:var(--display);font-size:24px;letter-spacing:.06em}
.preloader-name small{display:block;text-align:center;font-family:var(--font);font-size:9px;letter-spacing:.38em;color:var(--gold);margin-top:6px}
.preloader-bar{width:170px;height:1px;background:rgba(255,255,255,.14);position:relative;overflow:hidden}
.preloader-bar:after{content:'';position:absolute;inset:0;background:var(--gold);animation:barSweep 1.3s var(--ease) infinite}
@keyframes barSweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
#route-progress{position:fixed;top:0;left:0;width:100%;height:2px;z-index:250;background:linear-gradient(90deg,var(--gold),#f1dca8);box-shadow:0 0 14px rgba(200,162,90,.8);transform:scaleX(0);transform-origin:left;opacity:0;pointer-events:none}
#route-progress.run{opacity:1;transform:scaleX(.78);transition:transform 1.8s cubic-bezier(.08,.75,.2,1),opacity .15s}
#route-progress.finish{opacity:0;transform:scaleX(1);transition:transform .35s var(--ease),opacity .45s .3s}
#route-veil{position:fixed;inset:0;z-index:55;display:grid;place-items:center;background:rgba(248,245,239,.94);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .38s var(--ease),visibility .38s}
#route-veil.show{opacity:1;visibility:visible;pointer-events:auto}
.veil-inner{display:grid;justify-items:center;gap:16px;transform:translateY(10px);transition:transform .5s var(--ease)}
#route-veil.show .veil-inner{transform:none}
.veil-spinner{width:48px;height:48px;border-radius:50%;border:1px solid rgba(200,162,90,.25);border-top-color:var(--gold);animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.veil-label{font-size:11px;letter-spacing:.3em;text-transform:uppercase;font-weight:700;color:var(--gold-deep)}
#app{transition:opacity .38s var(--ease),transform .38s var(--ease)}
#app.is-leaving{opacity:0;transform:translateY(12px)}
#app.is-entering{animation:pageIn .8s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.reveal{opacity:0;transform:translateY(30px);transition:opacity .95s var(--ease),transform .95s var(--ease)}
.reveal.in{opacity:1;transform:none}

.listing-excerpt{font-size:14px;line-height:1.6;color:#6c7a87;margin:0 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.spec-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:26px 0 6px}
.spec-row>div{background:#fff;padding:16px 18px;display:grid;gap:3px}
.spec-row span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#98a3ad;font-weight:700}
.spec-row strong{font-family:var(--display);font-size:21px;font-weight:600;color:var(--navy-deep);line-height:1.2}
.feature-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
.feature-list li{display:flex;align-items:flex-start;gap:9px;font-size:15px;color:#2f4254}
.feature-list svg{color:var(--gold-deep);margin-top:4px}
@media (max-width:600px){.spec-row{grid-template-columns:1fr 1fr}.feature-list{grid-template-columns:1fr}.spec-row strong{font-size:19px}}
.brand{gap:14px}
.brand-emblem{height:56px;width:auto;transition:height .45s var(--ease)}

ass="btn btn-muted btn-wide">Back to ${prop?'Properties':'Machinery'}</a></div><div class="detail-help"><h3>Need more information?</h3><p>Send an enquiry with your requirements and preferred method of contact.</p><a href="#/contact">Contact us ${icon('arrow',16)}</a></div></aside></div></div></section><section class="section related-section"><div class="container">${sectionHead('YOU MAY ALSO LIKE',`More ${prop?'Properties':'Equipment'}`,'Explore other example listings.',`#/${kind}`,'See all')}${cards(data.filter(x=>x.id!==id))}</div></section>`;}

function renderCatalog(kind){const isProp=kind==='properties';const data=isProp?properties:machinery;const search=(document.getElementById('catalog-search')?.value||'').toLowerCase().trim(),category=document.getElementById('catalog-category')?.value||'All categories',sort=document.getElementById('catalog-sort')?.value||'featured';let filtered=data.filter(x=>(category==='All categories'||x.category===category)&&`${x.title} ${x.location} ${x.category} ${x.description}`.toLowerCase().includes(search));if(sort==='low')filtered.sort((a,b)=>a.amount-b.amount);if(sort==='high')filtered.sort((a,b)=>b.amount-a.amount);if(sort==='az')filtered.sort((a,b)=>a.title.localeCompare(b.title));document.getElementById('results-count').textContent=`Showing ${filtered.length} of ${data.length} example ${isProp?'properties':'machines'}`;document.getElementById('catalog-results').innerHTML=filtered.length?cards(filtered):`<div class="empty-state">${icon('search',34)}<h3>No matching items</h3><p>Try a different search term or category.</p><button class="btn btn-dark" id="clear-filters" type="button">Clear Filters</button></div>`;}

/* ---------- Lightbox with photo carousel ---------- */
let LB=null;
function openLightbox(set,index=0){if(!set.length)return;LB={set,i:index};const multi=set.length>1;const root=document.getElementById('lightbox-root');root.innerHTML=`<div class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer"><div class="lightbox-backdrop" data-close-lightbox></div><button type="button" class="lightbox-close" data-close-lightbox aria-label="Close photo viewer">${icon('close',22)}</button><div class="lightbox-content"><div class="lightbox-stage">${multi?`<button type="button" class="lb-nav lb-prev" data-lb-step="-1" aria-label="Previous photo">${icon('chevron',22)}</button>`:''}<img id="lb-img" alt=""/>${multi?`<button type="button" class="lb-nav lb-next" data-lb-step="1" aria-label="Next photo">${icon('chevron',22)}</button>`:''}</div><div class="lightbox-meta"><div><strong id="lb-title"></strong><span id="lb-caption"></span></div><span id="lb-count"></span></div>${multi?`<div class="lb-thumbs">${set.map((p,j)=>`<button type="button" data-lb-go="${j}" aria-label="Show photo ${j+1}"><img src="${IMG(p.file,'sm')}" alt="" loading="lazy"/></button>`).join('')}</div>`:''}</div></div>`;document.body.classList.add('modal-open');updateLightbox();root.querySelector('.lightbox-close').focus();}
function updateLightbox(){if(!LB)return;const p=LB.set[LB.i];const im=document.getElementById('lb-img');im.classList.remove('lb-anim');void im.offsetWidth;im.src=IMG(p.file);im.alt=p.title+(p.caption?' — '+p.caption:'');im.classList.add('lb-anim');document.getElementById('lb-title').textContent=p.title;document.getElementById('lb-caption').textContent=p.caption||'';document.getElementById('lb-count').textContent=`${String(LB.i+1).padStart(2,'0')} / ${String(LB.set.length).padStart(2,'0')}`;document.querySelectorAll('.lb-thumbs button').forEach((b,j)=>{b.classList.toggle('on',j===LB.i);if(j===LB.i)b.scrollIntoView({block:'nearest',inline:'nearest'});});const nx=LB.set[(LB.i+1)%LB.set.length];if(nx)new Image().src=IMG(nx.file);}
function stepLightbox(d){if(!LB)return;LB.i=(LB.i+d+LB.set.length)%LB.set.length;updateLightbox();}
function closeLightbox(){LB=null;document.getElementById('lightbox-root').innerHTML='';document.body.classList.remove('modal-open');}

function updateNav(path){document.querySelectorAll('nav [data-route]').forEach(a=>{const target=a.getAttribute('href').slice(1);const active=path===target||(path.startsWith(target+'/')&&target!=='/');a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});}
function parseRoute(){const raw=location.hash.slice(1)||'/';const [path,query='']=raw.split('?');return {path:path.split('#')[0]||'/',params:new URLSearchParams(query)};}

/* ---------- Router with realistic page loading ---------- */
const ROUTE_NAMES={'/':'Home','/properties':'Properties','/machinery':'Machinery','/about':'About','/services':'Services','/gallery':'Gallery','/contact':'Contact'};
function routeTitle(path){if(ROUTE_NAMES[path])return ROUTE_NAMES[path];const id=path.split('/')[2];const it=id&&findItem(id);return it?it.title:'Page not found';}
function buildPage(path){if(path==='/')return homePage();if(path==='/properties'||path==='/machinery')return catalogPage(path.slice(1));if(path.startsWith('/properties/'))return detailPage('properties',path.split('/')[2]);if(path.startsWith('/machinery/'))return detailPage('machinery',path.split('/')[2]);if(path==='/gallery')return galleryPage();if(path==='/about')return aboutPage();if(path==='/services')return servicesPage();if(path==='/contact')return contactPage();return notFound();}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function preloadFrom(html,path,limit=5){const srcs=new Set();srcs.add(path==='/'?IMG('hero-nairobi'):(html.match(/url\('(assets\/[^']+)'\)/)||[])[1]||IMG('banner-towers'));for(const m of html.matchAll(/ src="(assets\/[^"]+)"/g)){if(srcs.size>=limit)break;srcs.add(m[1]);}return Promise.all([...srcs].map(s=>new Promise(res=>{const im=new Image();im.onload=im.onerror=()=>res();im.src=s;})));}
let revealObserver;
function initReveal(){if(reduceMotion||!('IntersectionObserver' in window))return;revealObserver?.disconnect();revealObserver=new IntersectionObserver(entries=>entries.forEach(en=>{if(!en.isIntersecting)return;const el=en.target;revealObserver.unobserve(el);el.classList.add('in');setTimeout(()=>{el.classList.remove('reveal','in');el.style.transitionDelay='';},1400);}),{rootMargin:'0px 0px -6% 0px',threshold:.1});document.querySelectorAll('#app :is(.section-top,.listing-card,.benefit,.step,.service-card,.gallery-item,.gallery-strip-item,.about-visual,.about-copy,.mission-card,.detail-mosaic,.detail-description,.detail-aside,.contact-story,.contact-form-wrap,.contact-intro,.selling-grid>div,.mini-cta-inner,.catalog-toolbar)').forEach(el=>{const sibs=[...el.parentElement.children];el.classList.add('reveal');el.style.transitionDelay=`${(sibs.indexOf(el)%4)*90}ms`;revealObserver.observe(el);});}
function mount(path,params,html){document.getElementById('app').innerHTML=html;updateNav(path);closeMenu();closeLightbox();if(path==='/properties'||path==='/machinery')renderCatalog(path.slice(1));if(path==='/gallery')renderGallery();if(path==='/contact'&&params.has('item')){const msg=document.querySelector('textarea[name="message"]');if(msg)msg.value=`Hello, I would like to enquire about ${params.get('item')}. Please share more information.`;}document.title=`${routeTitle(path)} | Grand Axis Group Ltd`;const anchor=location.hash.includes('#selling')?document.getElementById('selling'):null;if(anchor)anchor.scrollIntoView({behavior:'instant'});else window.scrollTo({top:0,left:0,behavior:'instant'});initReveal();}
let navSeq=0,booted=false;
async function navigate(){
  const seq=++navSeq;const {path,params}=parseRoute();const html=buildPage(path);const app=document.getElementById('app');
  if(!booted){booted=true;document.getElementById('footer').innerHTML=footer();mount(path,params,html);await Promise.race([preloadFrom(html,path,3),wait(2500)]);await wait(reduceMotion?0:450);document.getElementById('preloader')?.classList.add('done');return;}
  const veil=document.getElementById('route-veil'),bar=document.getElementById('route-progress');
  closeMenu();closeLightbox();updateNav(path);
  document.getElementById('veil-label').textContent=`Loading ${routeTitle(path)}`;
  bar.className='';void bar.offsetWidth;bar.className='run';
  app.classList.remove('is-entering');app.classList.add('is-leaving');veil.classList.add('show');
  const started=performance.now();
  await Promise.all([wait(400),Promise.race([preloadFrom(html,path),wait(2000)])]);
  const minimum=reduceMotion?250:800;const elapsed=performance.now()-started;if(elapsed<minimum)await wait(minimum-elapsed);
  if(seq!==navSeq)return;
  mount(path,params,html);
  app.classList.remove('is-leaving');void app.offsetWidth;app.classList.add('is-entering');
  veil.classList.remove('show');bar.className='finish';
}

function handleSubmit(form){const result=form.querySelector('.form-feedback');result.hidden=false;result.className='form-feedback';result.innerHTML=`${icon('check',18)} <span>Your details passed the demo validation. <strong>No message was sent.</strong> Connect a secure email or CRM backend and provide the company's verified contact details to enable enquiries.</span>`;result.scrollIntoView({behavior:'smooth',block:'nearest'});}
document.addEventListener('click',e=>{
  const step=e.target.closest('[data-card-step]');if(step){e.preventDefault();stepCard(step.closest('.listing-media'),Number(step.dataset.cardStep));return;}
  const qv=e.target.closest('[data-quick-view]');if(qv){e.preventDefault();const it=findItem(qv.dataset.quickView);if(it){const media=qv.closest('.listing-media');openLightbox(listingSet(it),media?Number(media.dataset.index||0):0);}return;}
  const tile=e.target.closest('[data-listing-photo]');if(tile){const it=findItem(tile.dataset.listingPhoto);if(it)openLightbox(listingSet(it),Number(tile.dataset.photoIndex));return;}
  const galleryBtn=e.target.closest('[data-gallery-image]');if(galleryBtn){const g=gallery[Number(galleryBtn.dataset.galleryImage)];const set=(document.getElementById('gallery-grid')?gallerySet():gallery).map(x=>({file:x.file,title:x.title,caption:x.tag}));openLightbox(set,Math.max(0,set.findIndex(x=>x.file===g.file)));return;}
  const lbStep=e.target.closest('[data-lb-step]');if(lbStep){stepLightbox(Number(lbStep.dataset.lbStep));return;}
  const lbGo=e.target.closest('[data-lb-go]');if(lbGo&&LB){LB.i=Number(lbGo.dataset.lbGo);updateLightbox();return;}
  if(e.target.closest('[data-close-lightbox]')){closeLightbox();return;}
  const tab=e.target.closest('[data-gallery-filter]');if(tab){document.querySelectorAll('[data-gallery-filter]').forEach(t=>t.classList.toggle('active',t===tab));renderGallery(tab.dataset.galleryFilter);return;}
  if(e.target.closest('#clear-filters')){document.getElementById('catalog-search').value='';document.getElementById('catalog-category').selectedIndex=0;document.getElementById('catalog-sort').selectedIndex=0;renderCatalog(location.hash.includes('machinery')?'machinery':'properties');return;}
  if(e.target.closest('#menu-toggle')){const nav=document.getElementById('primary-nav'),toggle=document.getElementById('menu-toggle');const open=nav.classList.toggle('nav-open');toggle.classList.toggle('opened',open);toggle.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-label',open?'Close navigation':'Open navigation');return;}
});
document.addEventListener('mouseover',e=>{const media=e.target.closest('.listing-media');if(media&&!media.dataset.warm){media.dataset.warm='1';loadCardImages(media);}});
let touchX=null;
document.addEventListener('touchstart',e=>{const media=e.target.closest('.listing-media');touchX=media?e.touches[0].clientX:null;},{passive:true});
document.addEventListener('touchend',e=>{if(touchX===null)return;const media=e.target.closest('.listing-media');const dx=e.changedTouches[0].clientX-touchX;touchX=null;if(media&&Math.abs(dx)>40)stepCard(media,dx<0?1:-1);},{passive:true});
document.addEventListener('input',e=>{if(e.target.matches('#catalog-search'))renderCatalog(location.hash.includes('machinery')?'machinery':'properties');});
document.addEventListener('change',e=>{if(e.target.matches('#catalog-category, #catalog-sort'))renderCatalog(location.hash.includes('machinery')?'machinery':'properties');});
document.addEventListener('submit',e=>{if(e.target.matches('[data-contact-form]')){e.preventDefault();handleSubmit(e.target);}});
document.addEventListener('keydown',e=>{if(!LB)return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowRight')stepLightbox(1);if(e.key==='ArrowLeft')stepLightbox(-1);});
const headerEl=document.getElementById('site-header');
window.addEventListener('scroll',()=>headerEl.classList.toggle('scrolled',window.scrollY>40),{passive:true});
window.addEventListener('hashchange',navigate);
navigate();
</script></body>
</html>
